<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>過去の進路実績ダッシュボード</title>
    <meta name="description" content="過去の進路実績を閲覧・分析するためのダッシュボード">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="app-container">
        <header class="glass-panel main-header">
            <div class="header-content">
                <h1>進路実績アーカイブ</h1>
                <p class="subtitle">Career Track Records</p>
            </div>
            <div class="header-actions">
                <label for="csv-upload" class="upload-btn">
                    <span class="icon">📁</span> データ読み込み
                </label>
                <input type="file" id="csv-upload" accept=".csv" style="display: none;">
            </div>
        </header>

        <main class="dashboard-content">
            <section class="glass-panel controls-section">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="実績を検索... (例: 事業所名, 産業)">
                </div>
                <div class="filter-group">
                    <select id="year-filter" class="custom-select">
                        <option value="">全ての年度</option>
                    </select>
                </div>
                <div class="filter-group">
                    <select id="gakka-filter" class="custom-select">
                        <option value="">全ての学科</option>
                    </select>
                </div>
                <div class="filter-group">
                    <select id="gender-filter" class="custom-select">
                        <option value="">全ての性別</option>
                        <option value="男">男子</option>
                        <option value="女">女子</option>
                    </select>
                </div>
            </section>

            <section class="summary-cards">
                <div class="glass-panel card">
                    <h3>総登録数</h3>
                    <div class="card-value" id="total-count">—</div>
                </div>
                <div class="glass-panel card">
                    <h3>男子</h3>
                    <div class="card-value" id="male-count">—</div>
                </div>
                <div class="glass-panel card">
                    <h3>女子</h3>
                    <div class="card-value" id="female-count">—</div>
                </div>
            </section>

            <section class="glass-panel data-section">
                <div class="table-container">
                    <table id="records-table">
                        <thead>
                            <tr id="table-header">
                                <th>データが読み込まれていません</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <tr>
                                <td class="empty-state">CSVファイルを読み込んでください</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
